name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Potato-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Potato ${{ github.ref_name }} · Debug"
          body: |
            Potato Android 测试版。

            - 包名：`com.potato.focus`
            - 应用版本：1.0
            - 最低系统：Android 8.0
            - 构建：GitHub Actions Debug 构建
            - 安装前请确认已允许安装未知来源应用
            - 该版本使用 GitHub Actions 生成的 Debug 签名，与本地 debug 包签名可能不同
            - 如果手机已安装本地 debug 包，直接覆盖安装可能失败；请先导出数据，再卸载旧包安装
            - 该版本仅用于个人测试

            完整功能与构建说明见仓库 README。
          files: release/Potato-*-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
