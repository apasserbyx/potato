name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Potato-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Potato ${GITHUB_REF_NAME} · Debug"
          body: |
            Potato Android 测试版。

            - 包名：`com.potato.focus`
            - 版本：1.0
            - 最低系统：Android 8.0
            - 构建：GitHub Actions Debug 构建
            - 安装前请确认已允许安装未知来源应用
            - 该版本使用 Android Debug 签名，仅用于个人测试

            完整功能与构建说明见仓库 README。
          files: release/Potato-*-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
